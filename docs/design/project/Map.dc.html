<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта посадок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#234010;text-decoration:none}a:hover{color:#4F7A2A}
button{font-family:inherit;cursor:pointer}
a:active,button:active{transform:scale(.96)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px)}60%{transform:translateY(0)}78%{transform:translateY(-5px)}100%{transform:translateY(0)}}
@keyframes sheet{0%{transform:translateY(110%)}70%{transform:translateY(-6px)}100%{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bloom{0%{transform:scale(.8) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.hop{animation:hop .6s cubic-bezier(.34,1.56,.64,1) both}
.sheet{animation:sheet .45s cubic-bezier(.2,0,0,1) both}
.fade{animation:fade .2s ease-out both}
.bloom{animation:bloom .25s cubic-bezier(.34,1.56,.64,1) both}
@media (prefers-reduced-motion: reduce){.hop,.sheet,.bloom{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFE8D8; font-family: 'Manrope', system-ui, sans-serif; color: #1E2B14">
  <svg role="img" aria-label="Карта Алматы в стилизованном виде" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0">
    <rect width="390" height="844" fill="#EFE8D8"></rect>
    <path d="M30 140 C70 120 110 150 120 190 C90 220 40 210 30 140Z" fill="#D6E2C8"></path>
    <path d="M250 210 C300 190 350 220 340 270 C300 290 250 270 250 210Z" fill="#D6E2C8"></path>
    <path d="M150 400 C190 380 240 400 230 440 C200 460 150 450 150 400Z" fill="#D6E2C8"></path>
    <path d="M110 0 C120 120 90 260 130 420 C150 500 140 560 150 640" stroke="#CFE0E8" stroke-width="8" fill="none" stroke-linecap="round"></path>
    <path d="M300 0 C290 140 320 300 290 460 C280 520 300 580 290 640" stroke="#CFE0E8" stroke-width="6" fill="none" stroke-linecap="round"></path>
    <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M-10 110 L400 90"></path><path d="M-10 250 L400 235"></path><path d="M-10 370 L400 360"></path><path d="M-10 480 L400 470"></path>
      <path d="M70 0 L80 640"></path><path d="M200 0 L205 640"></path><path d="M340 0 L335 640"></path>
    </g>
    <g stroke="#F8F4EA" stroke-width="3" fill="none"><path d="M-10 180 L400 165"></path><path d="M-10 310 L400 300"></path><path d="M140 0 L145 640"></path><path d="M270 0 L272 640"></path></g>
    <text x="215" y="228" font-family="Manrope, sans-serif" font-size="10" font-weight="700" fill="#8C8470">пр. Абая</text>
    <text x="215" y="466" font-family="Manrope, sans-serif" font-size="10" font-weight="700" fill="#8C8470">пр. Аль-Фараби</text>
    <path d="M-10 640 L-10 540 L40 500 L90 530 L150 470 L210 520 L260 480 L320 520 L400 490 L400 640Z" fill="#B3C3AA"></path>
    <path d="M140 482 L150 470 L162 484 L154 480 L150 488 L146 480Z" fill="#FFFFFF"></path><path d="M250 490 L260 480 L270 492 L264 488 L260 494 L256 488Z" fill="#FFFFFF"></path>
    <path d="M-10 844 L-10 600 L60 560 L130 600 L200 540 L280 590 L350 555 L400 580 L400 844Z" fill="#A3B699"></path>
  </svg>

  <sc-for list="{{others}}" as="o" hint-placeholder-count="0">
    <button class="fade" aria-label="{{o.label}}" style="position: absolute; left: {{o.x}}; top: {{o.y}}; width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{o.cluster}}" hint-placeholder-val="{{ false }}"><span style="width: 40px; height: 40px; border-radius: 50%; background: #B3C3AA; border: 3px solid #FFFFFF; color: #1C330C; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(35,64,16,0.18); font-variant-numeric: tabular-nums">{{o.n}}</span></sc-if>
      <sc-if value="{{o.single}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="26" height="32" viewBox="0 0 26 32"><path d="M13 31 C4 22 1 15 3 8 C6 1 20 1 23 8 C25 15 22 22 13 31Z" fill="#B3C3AA" stroke="#FFFFFF" stroke-width="2"></path></svg></sc-if>
    </button>
  </sc-for>
  <sc-for list="{{mine}}" as="m" hint-placeholder-count="3">
    <button class="{{m.cls}}" key="{{m.k}}" aria-label="{{m.label}}" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="position: absolute; left: {{m.x}}; top: {{m.y}}; width: 48px; height: 56px; border: 0; background: transparent; padding: 0; display: flex; align-items: flex-start; justify-content: center">
      <svg aria-hidden="true" width="{{m.w}}" height="{{m.h}}" viewBox="0 0 26 32" style="filter: drop-shadow(0 4px 6px rgba(35,64,16,0.3)); transition: width .2s, height .2s"><path d="M13 31 C4 22 1 15 3 8 C6 1 20 1 23 8 C25 15 22 22 13 31Z" fill="{{m.fill}}" stroke="#FFFFFF" stroke-width="2"></path><path d="M13 22 V10 M13 15 l-4 -3 M13 13 l4 -3" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </button>
  </sc-for>

  <div style="position: absolute; top: 52px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center">
    <div role="tablist" aria-label="Какие посадки показать" style="flex: 1; position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: rgba(255,255,255,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; padding: 4px; height: 52px; box-sizing: border-box; box-shadow: 0 6px 18px rgba(35,64,16,0.12)">
      <div aria-hidden="true" style="position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px; background: #4F7A2A; transition: transform .25s cubic-bezier(.33,1,.68,1); transform: {{slider}}"></div>
      <button role="tab" aria-selected="{{selMine}}" onClick="{{showMine}}" style="position: relative; border: 0; background: transparent; font-size: 15px; font-weight: 700; color: {{mineFg}}; transition: color .25s">Мои</button>
      <button role="tab" aria-selected="{{selAll}}" onClick="{{showAll}}" style="position: relative; border: 0; background: transparent; font-size: 15px; font-weight: 700; color: {{allFg}}; transition: color .25s">Все посадки</button>
    </div>
    <button aria-label="Моё местоположение" style="width: 52px; height: 52px; border: 0; border-radius: 16px; background: rgba(255,255,255,0.88); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(35,64,16,0.12)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#234010" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"></path></svg>
    </button>
  </div>

  <sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
    <section class="sheet" key="{{selKey}}" aria-label="Дерево {{sel.name}}" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 112px; background: #FFFFFF; border-radius: 32px 32px 0 0; box-shadow: 0 -10px 30px rgba(35,64,16,0.14); display: flex; flex-direction: column; gap: 12px">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D2DAC9"></span>
      <div style="display: flex; gap: 14px">
        <div role="img" aria-label="Фото посадки" style="width: 88px; height: 88px; border-radius: 18px; background: repeating-linear-gradient(135deg, #C9D6BF 0 8px, #BFCDB4 8px 16px); flex: none; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#234010" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="align-self: flex-start; height: 24px; padding: 0 10px; border-radius: 999px; background: {{sel.chipBg}}; color: {{sel.chipFg}}; font-size: 11px; font-weight: 700; display: flex; align-items: center">{{sel.status}}</span>
          <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #234010">{{sel.name}}</span>
          <span style="font-size: 13px; color: #4E5A44">{{sel.kind}} · посажено {{sel.date}}</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="background: #F6F1E7; border-radius: 14px; padding: 10px 12px"><div style="font-size: 11px; color: #4E5A44">Адрес</div><div style="font-size: 13px; font-weight: 700">{{sel.addr}}</div></div>
        <div style="background: #F6F1E7; border-radius: 14px; padding: 10px 12px"><div style="font-size: 11px; color: #4E5A44">Координаты</div><div style="font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums">{{sel.geo}}</div></div>
      </div>
      <div style="display: flex; gap: 10px">
        <a href="TreePlanted.dc.html" style="flex: 1; height: 52px; border-radius: 16px; background: #DCE6D3; color: #234010; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">Карточка</a>
        <a href="#" style="flex: 1.3; height: 52px; border-radius: 16px; background: #234010; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"></path></svg>Маршрут</a>
      </div>
    </section>
  </sc-if>

  <nav aria-label="Основная навигация" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 72px; border-radius: 28px; background: rgba(255,255,255,0.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(35,64,16,0.14); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box">
    <a href="Home.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Главная</a>
    <a href="Catalog.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>Каталог</a>
    <a href="Forest.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"></path><path d="M7 16v6"></path><path d="M13 19v3"></path><path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5"></path></svg>Мой лес</a>
    <a href="Map.dc.html" aria-current="page" style="height: 52px; padding: 0 16px; border-radius: 999px; background: #4F7A2A; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">
      <svg class="bloom" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>Карта</a>
    <a href="Profile.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Профиль</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'all', sel: 0, hop: 1 }; }
  renderVals() {
    const s = this.state;
    const trees = [
      { name: 'Листик', kind: 'Карагач', date: '21 ноября 2026', addr: 'Бостандыкский р-н', geo: '43.2185, 76.9282', x: 196, y: 410, status: 'Посажено', chipBg: '#DCE6D3', chipFg: '#234010' },
      { name: 'Алма', kind: 'Клён', date: '12 октября 2026', addr: 'Медеуский р-н', geo: '43.2441, 76.9572', x: 262, y: 200, status: 'Посажено', chipBg: '#DCE6D3', chipFg: '#234010' },
      { name: 'Тянь-Шань', kind: 'Ель', date: '18 апреля 2026', addr: 'Бостандыкский р-н', geo: '43.2297, 76.9025', x: 92, y: 300, status: 'На мониторинге', chipBg: '#DDEBF3', chipFg: '#1F5577' }
    ];
    const others = [
      { x: 40, y: 200, n: 12 }, { x: 300, y: 330, n: 8 }, { x: 150, y: 150, n: 0 }, { x: 230, y: 300, n: 0 }, { x: 60, y: 420, n: 0 }, { x: 320, y: 410, n: 5 }, { x: 170, y: 250, n: 0 }
    ];
    const all = s.mode === 'all';
    const sel = s.sel == null ? null : trees[s.sel];
    return {
      slider: all ? 'translateX(100%)' : 'translateX(0)',
      selMine: all ? 'false' : 'true', selAll: all ? 'true' : 'false',
      mineFg: all ? '#234010' : '#FFFFFF', allFg: all ? '#FFFFFF' : '#234010',
      showMine: () => this.setState({ mode: 'mine' }),
      showAll: () => this.setState({ mode: 'all' }),
      others: all ? others.map((o) => ({ x: o.x + 'px', y: o.y + 'px', n: o.n, cluster: o.n > 0, single: o.n === 0, label: o.n > 0 ? o.n + ' посадок' : 'Посадка участника' })) : [],
      mine: trees.map((t, i) => {
        const on = s.sel === i;
        return {
          x: (t.x - 24) + 'px', y: (t.y - 48) + 'px', label: 'Моё дерево ' + t.name,
          pressed: on ? 'true' : 'false', cls: on ? 'hop' : '', k: on ? 'h' + s.hop : 'n' + i,
          w: on ? 38 : 30, h: on ? 46 : 37, fill: on ? '#234010' : '#4F7A2A',
          pick: () => this.setState({ sel: i, hop: this.state.hop + 1 })
        };
      }),
      hasSel: !!sel, sel: sel || trees[0], selKey: 's' + s.sel
    };
  }
}
</script>
</body>
</html>
