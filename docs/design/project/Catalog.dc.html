<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Каталог деревьев</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#234010;text-decoration:none}a:hover{color:#4F7A2A}
button{font-family:inherit;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes bloom{0%{transform:scale(.8) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.rise{animation:rise .3s cubic-bezier(.33,1,.68,1) both}
.bloom{animation:bloom .25s cubic-bezier(.34,1.56,.64,1) both}
.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.rise,.bloom{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F1E7; font-family: 'Manrope', system-ui, sans-serif; color: #1E2B14">
  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none">
    <div style="padding: 56px 20px 120px; display: flex; flex-direction: column; gap: 16px">
      <header style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700; color: #234010">Каталог деревьев</h1>
        <p style="margin: 0; font-size: 15px; color: #4E5A44">Виды, которые хорошо приживаются в Алматы</p>
      </header>
      <div class="scroll" role="tablist" aria-label="Фильтр" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
          <button role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="flex: none; height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 700; transition: background .2s, color .2s">{{c.label}}</button>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{trees}}" as="t" hint-placeholder-count="6">
          <a class="rise" href="TreeDetail.dc.html" style="animation-delay: {{t.delay}}; background: #FFFFFF; border-radius: 24px; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px rgba(35,64,16,0.08); position: relative">
            <div role="img" aria-label="Фото: {{t.name}}" style="height: 128px; border-radius: 18px; background: repeating-linear-gradient(135deg, #DCE6D3 0 10px, #D2DEC8 10px 20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; overflow: hidden">
              <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#234010" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
              <span style="font-size: 11px; font-weight: 700; color: #234010">[Фото: {{t.name}}]</span>
            </div>
            <sc-if value="{{t.popular}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: 18px; left: 18px; height: 24px; padding: 0 10px; border-radius: 999px; background: #234010; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center">Популярное</span>
            </sc-if>
            <div style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px">
              <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #234010">{{t.name}}</span>
              <span style="font-size: 12px; line-height: 1.35; color: #4E5A44; min-height: 32px">{{t.desc}}</span>
            </div>
            <div style="padding: 0 4px; display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 15px; font-weight: 800; color: #1E2B14; font-variant-numeric: tabular-nums">6 000 ₸</span>
              <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #DCE6D3; color: #234010; font-size: 12px; font-weight: 700; display: flex; align-items: center">Выбрать</span>
            </div>
          </a>
        </sc-for>
      </div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 24px 0; text-align: center; color: #4E5A44">В этой категории пока нет деревьев</p>
      </sc-if>
    </div>
  </div>

  <nav aria-label="Основная навигация" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 72px; border-radius: 28px; background: rgba(255,255,255,0.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(35,64,16,0.14); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box">
    <a href="Home.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Главная</a>
    <a href="Catalog.dc.html" aria-current="page" style="height: 52px; padding: 0 16px; border-radius: 999px; background: #4F7A2A; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">
      <svg class="bloom" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>Каталог</a>
    <a href="Forest.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"></path><path d="M7 16v6"></path><path d="M13 19v3"></path><path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5"></path></svg>Мой лес</a>
    <a href="Map.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Карта</a>
    <a href="Profile.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Профиль</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'all' }; }
  renderVals() {
    const f = this.state.f;
    const all = [
      { name: 'Карагач', desc: 'Неприхотлив, держит пыль и жару', shape: 'round', tags: ['leaf', 'fast', 'yard'], popular: true, tint: '#DCE6D3' },
      { name: 'Тополь', desc: 'Быстро даёт тень вдоль улиц', shape: 'tall', tags: ['leaf', 'fast'], tint: '#D9E9F2' },
      { name: 'Клён', desc: 'Яркая осень и густая крона', shape: 'wide', tags: ['leaf', 'yard'], tint: '#F3E4D3' },
      { name: 'Ель', desc: 'Зелёная круглый год', shape: 'cone', tags: ['conifer'], tint: '#DCE6D3' },
      { name: 'Ясень', desc: 'Долговечный, лёгкая ажурная тень', shape: 'ash', tags: ['leaf'], tint: '#D9E9F2' },
      { name: 'Берёза', desc: 'Светлая, для дворов и скверов', shape: 'birch', tags: ['leaf', 'yard'], tint: '#EEF2E4' }
    ];
    const chipsDef = [['all', 'Все'], ['leaf', 'Лиственные'], ['conifer', 'Хвойные'], ['fast', 'Быстрорастущие'], ['yard', 'Для двора']];
    const list = all.filter((t) => f === 'all' || t.tags.indexOf(f) >= 0);
    return {
      chips: chipsDef.map(([id, label]) => ({
        label, sel: id === f ? 'true' : 'false',
        bg: id === f ? '#4F7A2A' : '#DCE6D3', fg: id === f ? '#FFFFFF' : '#234010',
        pick: () => this.setState({ f: id })
      })),
      trees: list.map((t, i) => ({
        ...t, delay: (i * 50) + 'ms', popular: !!t.popular,
        round: t.shape === 'round', tall: t.shape === 'tall', wide: t.shape === 'wide',
        cone: t.shape === 'cone', ash: t.shape === 'ash', birch: t.shape === 'birch'
      })),
      empty: list.length === 0
    };
  }
}
</script>
</body>
</html>
