<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профиль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#234010;text-decoration:none}a:hover{color:#4F7A2A}
button{font-family:inherit;cursor:pointer}
@keyframes bar{from{width:0}}
@keyframes bloom{0%{transform:scale(.8) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shine{from{transform:translateX(-120%) rotate(20deg)}to{transform:translateX(220%) rotate(20deg)}}
.bar{animation:bar .7s cubic-bezier(.33,1,.68,1) both}
.bloom{animation:bloom .25s cubic-bezier(.34,1.56,.64,1) both}
.card{transition:transform .6s cubic-bezier(.2,0,0,1);transform-style:preserve-3d}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.shine{animation:shine .8s .5s ease-out both}
.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.bar,.bloom,.shine{animation:none}.card{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F1E7; font-family: 'Manrope', system-ui, sans-serif; color: #1E2B14">
  <div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none">
    <div style="padding: 56px 20px 120px; display: flex; flex-direction: column; gap: 18px">
      <header style="display: flex; gap: 14px; align-items: center">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: #B3C3AA; border: 3px solid #FFFFFF; box-shadow: 0 6px 16px rgba(35,64,16,0.12); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #234010; flex: none">А</div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: baseline; gap: 8px"><h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 700; color: #234010">Алия</h1><span style="font-size: 12px; color: #4E5A44">7 мес. в проекте</span></div>
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 700; color: #4F7A2A">Эко-активист · уровень 3</span><span style="color: #4E5A44; font-variant-numeric: tabular-nums">340 / 550</span></div>
          <div style="height: 8px; border-radius: 4px; background: #DCE6D3; overflow: hidden"><div class="bar" style="width: 62%; height: 100%; border-radius: 4px; background: #4F7A2A"></div></div>
        </div>
      </header>

      <section aria-label="Статистика вклада" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 8px; text-align: center"><div style="font-size: 22px; font-weight: 800; color: #234010; font-variant-numeric: tabular-nums">3</div><div style="font-size: 11px; color: #4E5A44">куплено деревьев</div></div>
        <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 8px; text-align: center"><div style="font-size: 22px; font-weight: 800; color: #234010; font-variant-numeric: tabular-nums">2</div><div style="font-size: 11px; color: #4E5A44">посажено</div></div>
        <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 8px; text-align: center"><div style="font-size: 22px; font-weight: 800; color: #234010; font-variant-numeric: tabular-nums">44</div><div style="font-size: 11px; color: #4E5A44">кг CO₂/год</div></div>
        <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 8px; text-align: center"><div style="font-size: 22px; font-weight: 800; color: #234010; font-variant-numeric: tabular-nums">340</div><div style="font-size: 11px; color: #4E5A44">эко-баллы</div></div>
      </section>

      <section aria-label="Достижения" style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; color: #234010">Достижения</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; perspective: 800px">
          <sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
            <button onClick="{{b.flip}}" aria-label="{{b.aria}}" style="height: 112px; border: 0; padding: 0; background: transparent; position: relative">
              <span class="card" style="position: absolute; inset: 0; transform: {{b.rot}}">
                <span class="face" style="position: absolute; inset: 0; border-radius: 20px; background: #EEEAE0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
                  <span style="width: 48px; height: 48px; border-radius: 50%; background: #D5D2C8; display: flex; align-items: center; justify-content: center">
                    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B6A62" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
                  </span>
                  <span style="font-size: 12px; font-weight: 700; color: #5F5E57; padding: 0 6px">{{b.name}}</span>
                </span>
                <span class="face" style="position: absolute; inset: 0; border-radius: 20px; background: {{b.bg}}; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; overflow: hidden">
                  <span style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(35,64,16,0.15)">
                    <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{b.c}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>
                  </span>
                  <span style="font-size: 12px; font-weight: 800; color: #1E2B14; padding: 0 6px">{{b.name}}</span>
                  <sc-if value="{{b.open}}" hint-placeholder-val="{{ false }}"><span class="shine" aria-hidden="true" style="position: absolute; top: -20px; bottom: -20px; left: 0; width: 30px; background: rgba(255,255,255,0.6)"></span></sc-if>
                </span>
              </span>
            </button>
          </sc-for>
        </div>
      </section>

      <section aria-label="История заказов" style="background: #FFFFFF; border-radius: 24px; padding: 6px 18px; box-shadow: 0 8px 24px rgba(35,64,16,0.08)">
        <h2 style="margin: 12px 0 4px; font-size: 16px; font-weight: 800">История заказов</h2>
        <sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #EEF0E8">
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 14px; font-weight: 700">{{o.t}}</div>
              <div style="font-size: 12px; color: #4E5A44; font-variant-numeric: tabular-nums">{{o.d}}</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
              <span style="font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums">{{o.sum}}</span>
              <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: {{o.bg}}; color: {{o.fg}}; font-size: 11px; font-weight: 700; display: flex; align-items: center">{{o.s}}</span>
            </div>
          </div>
        </sc-for>
      </section>

      <section aria-label="Настройки" style="background: #FFFFFF; border-radius: 24px; padding: 4px 6px">
        <sc-for list="{{settings}}" as="r" hint-placeholder-count="4">
          <a href="#" style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #1E2B14">
            <span style="width: 36px; height: 36px; border-radius: 12px; background: #DCE6D3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#234010" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg></span>
            <span style="flex: 1; font-size: 15px; font-weight: 600">{{r.t}}</span>
            <span style="font-size: 13px; color: #4E5A44">{{r.v}}</span>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5A44" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </sc-for>
      </section>
    </div>
  </div>

  <nav aria-label="Основная навигация" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 72px; border-radius: 28px; background: rgba(255,255,255,0.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(35,64,16,0.14); display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box">
    <a href="Home.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Главная</a>
    <a href="Catalog.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>Каталог</a>
    <a href="Forest.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10v.2A3 3 0 0 1 8.9 16H5a3 3 0 0 1-1-5.8V10a3 3 0 0 1 6 0Z"></path><path d="M7 16v6"></path><path d="M13 19v3"></path><path d="M12 19h8.3a1 1 0 0 0 .7-1.7L18 14h.3a1 1 0 0 0 .7-1.7L16 9h.2a1 1 0 0 0 .8-1.7L13 3l-1.4 1.5"></path></svg>Мой лес</a>
    <a href="Map.dc.html" style="width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #4E5A44; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Карта</a>
    <a href="Profile.dc.html" aria-current="page" style="height: 52px; padding: 0 16px; border-radius: 999px; background: #4F7A2A; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">
      <svg class="bloom" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>Профиль</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: { 0: true, 3: true } }; }
  renderVals() {
    const o = this.state.open;
    const defs = [
      { name: 'Первый росток', c: '#4F7A2A', bg: '#DCE6D3', icon: 'M12 21v-9M12 12C12 8 9 6 5 6c0 4 3 6 7 6zM12 10c0-3 2.5-5 6-5 0 3.5-2.5 5-6 5z' },
      { name: '5 деревьев', c: '#234010', bg: '#E8EFDF', icon: 'M7 21v-5M17 21v-5M7 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
      { name: 'Лесник', c: '#6E4A00', bg: '#FBF1DC', icon: 'M12 2l3 6h-2l3 5h-2l3 5H7l3-5H8l3-5H9zM12 18v4' },
      { name: 'Друг Алматы', c: '#1F5577', bg: '#D9E9F2', icon: 'M3 20l6-10 4 6 3-4 5 8zM12 21s0 0 0 0' },
      { name: 'Чистый воздух', c: '#1F5577', bg: '#D9E9F2', icon: 'M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8' },
      { name: 'Год в проекте', c: '#4F7A2A', bg: '#DCE6D3', icon: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4' }
    ];
    return {
      badges: defs.map((d, i) => ({
        ...d, open: !!o[i],
        rot: o[i] ? 'rotateY(180deg)' : 'rotateY(0)',
        aria: d.name + (o[i] ? ', получено' : ', закрыто'),
        flip: () => this.setState({ open: { ...this.state.open, [i]: !this.state.open[i] } })
      })),
      orders: [
        { t: 'Карагач «Листик»', d: 'PT-ALM-000127 · 9 ноября 2026', sum: '6 000 ₸', s: 'Посажено', bg: '#DCE6D3', fg: '#234010' },
        { t: 'Клён «Алма»', d: 'PT-ALM-000098 · 2 сентября 2026', sum: '6 000 ₸', s: 'Посажено', bg: '#DCE6D3', fg: '#234010' },
        { t: 'Ель «Тянь-Шань»', d: 'PT-ALM-000041 · 30 марта 2026', sum: '6 000 ₸', s: 'Мониторинг', bg: '#DDEBF3', fg: '#1F5577' }
      ],
      settings: [
        { t: 'Уведомления', v: 'Вкл.', icon: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0' },
        { t: 'Тема', v: 'Светлая', icon: 'M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z' },
        { t: 'Язык', v: 'Русский', icon: 'M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z' },
        { t: 'Способы оплаты', v: '', icon: 'M3 6h18v12H3zM3 10h18' }
      ]
    };
  }
}
</script>
</body>
</html>
